name: Egloos RSS Auto Update Bot

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # [핵심] 외부 main.py 파일을 직접 실행
    - name: Run Egloos Scraper
      run: python main.py

    - name: Commit and Push Updated RSS
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add egloos_feedv2.xml
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated RSS update via main.py" && git push)
