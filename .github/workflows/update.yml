name: Egloos RSS Auto Update Bot

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # [핵심 수정] Playwright 및 브라우저 의존성 패키지 설치
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install --with-deps chromium

    # 질문자님의 Playwright 기반 main.py 실행
    - name: Run Egloos Scraper
      run: python main.py    
      
    # 생성된 RSS XML 파일 커밋 및 푸시
    - name: Commit and Push Updated RSS
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 저장소에 있는 실제 파일명(egloos_feedv2.xml) 또는 모든 xml 등록
        git add *.xml
        
        # 변경 사항이 있을 때만 커밋 및 푸시 (에러 방지)
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated RSS update" && git push)
